# Render "Blueprint" for the backend API (https://render.com). NOT YET TESTED.
# In Render: New > Blueprint > pick this repository. Then fill in the two
# values marked "sync: false" in the dashboard.
services:
  - type: web
    name: janam-patrika-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Headless Chromium needs memory: use at least 1 GB (the free plan is too small for PDFs)
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      # The website's address, so its pages are allowed to call this API
      - key: FRONTEND_ORIGINS
        sync: false
      # The password for the /admin page: 12 or more characters
      - key: ADMIN_TOKEN
        sync: false
      # The website's address again, for the download link in emails
      - key: SITE_URL
        sync: false
      # Orders live on the disk below, so they survive restarts and deploys
      - key: DATABASE_PATH
        value: /var/data/app.db
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
    disk:
      name: orders
      mountPath: /var/data
      sizeGB: 1
